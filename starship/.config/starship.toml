# Pastel theme - see [palettes.pastel] at the end of this file
palette = 'pastel'

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

[line_break]
disabled = true

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
 
[bun]
format = '\[[$symbol($version)]($style)\]'
 
[c]
format = '\[[$symbol($version(-$name))]($style)\]'
 
[cmake]
format = '\[[$symbol($version)]($style)\]'
 
[cmd_duration]
style = 'subtext'
min_time = 2000
format = '\[[⏱ $duration]($style)\]'
 
[cobol]
format = '\[[$symbol($version)]($style)\]'
 
[conda]
format = '\[[$symbol$environment]($style)\]'
 
[crystal]
format = '\[[$symbol($version)]($style)\]'
 
[daml]
format = '\[[$symbol($version)]($style)\]'
 
[dart]
format = '\[[$symbol($version)]($style)\]'
 
[deno]
format = '\[[$symbol($version)]($style)\]'
 
[docker_context]
format = '\[[$symbol$context]($style)\]'
 
[dotnet]
format = '\[[$symbol($version)(🎯 $tfm)]($style)\]'
 
[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\]'
 
[elm]
format = '\[[$symbol($version)]($style)\]'
 
[erlang]
format = '\[[$symbol($version)]($style)\]'
 
[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
 
[git_branch]
style = 'bold peach'
format = '\[[$symbol$branch]($style)\]'
 
[git_status]
style = 'bold yellow'
format = '([\[$all_status$ahead_behind\]]($style))'
 
[golang]
format = '\[[$symbol($version)]($style)\]'
 
[haskell]
format = '\[[$symbol($version)]($style)\]'
 
[helm]
format = '\[[$symbol($version)]($style)\]'
 
[hg_branch]
format = '\[[$symbol$branch]($style)\]'
 
[java]
format = '\[[$symbol($version)]($style)\]'
 
[julia]
format = '\[[$symbol($version)]($style)\]'
 
[kotlin]
format = '\[[$symbol($version)]($style)\]'
 
[kubernetes]
format = '\[[$symbol$context( \($namespace\))]($style)\]'
 
[lua]
format = '\[[$symbol($version)]($style)\]'
 
[memory_usage]
format = '\[$symbol[$ram( | $swap)]($style)\]'
 
[meson]
format = '\[[$symbol$project]($style)\]'
 
[nim]
format = '\[[$symbol($version)]($style)\]'
 
[nix_shell]
format = '\[[$symbol$state( \($name\))]($style)\]'
 
[nodejs]
format = '\[[$symbol($version)]($style)\]'
 
[ocaml]
format = '\[[$symbol($version)(\($switch_indicator$switch_name\))]($style)\]'
 
[openstack]
format = '\[[$symbol$cloud(\($project\))]($style)\]'
 
[package]
format = '\[[$symbol$version]($style)\]'
 
[perl]
format = '\[[$symbol($version)]($style)\]'
 
[php]
format = '\[[$symbol($version)]($style)\]'
 
[pulumi]
format = '\[[$symbol$stack]($style)\]'
 
[purescript]
format = '\[[$symbol($version)]($style)\]'
 
[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
 
[raku]
format = '\[[$symbol($version-$vm_version)]($style)\]'
 
[red]
format = '\[[$symbol($version)]($style)\]'
 
[ruby]
format = '\[[$symbol($version)]($style)\]'
 
[rust]
format = '\[[$symbol($version)]($style)\]'
 
[scala]
format = '\[[$symbol($version)]($style)\]'
 
[spack]
format = '\[[$symbol$environment]($style)\]'
 
[sudo]
format = '\[[as $symbol]\]'
 
[swift]
format = '\[[$symbol($version)]($style)\]'
 
[terraform]
format = '\[[$symbol$workspace]($style)\]'
 
[time]
format = '\[[$time]($style)\]'
 
[username]
style_user = 'bold pink'
style_root = 'bold red'
show_always = true
format = '[$user]($style)'
 
[vagrant]
format = '\[[$symbol($version)]($style)\]'
 
[vlang]
format = '\[[$symbol($version)]($style)\]'
 
[zig]
format = '\[[$symbol($version)]($style)\]'


# ─────────────────────────────────────────────────────────────
#  Pastel theme (Catppuccin Mocha)
# ─────────────────────────────────────────────────────────────

# hostname is SSH-only by default, which is why `user@host` vanished locally
[hostname]
ssh_only = false
format = '[@$hostname]($style) '
style = 'bold blue'

[directory]
style = 'bold mauve'
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[palettes.pastel]
rosewater = '#f5e0dc'
flamingo  = '#f2cdcd'
pink      = '#f5c2e7'
mauve     = '#cba6f7'
red       = '#f38ba8'
peach     = '#fab387'
yellow    = '#f9e2af'
green     = '#a6e3a1'
teal      = '#94e2d5'
sky       = '#89dceb'
blue      = '#89b4fa'
lavender  = '#b4befe'
subtext   = '#a6adc8'
